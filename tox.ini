[tox]
envlist = core, py3
isolated_build = True

[testenv]
deps =
    pytest
    pytest-cov
    pytest-xdist
extras = all
passenv =
    # the virtual display of the CI (rendering of the plots in the docstring examples
    # and in the documentation)
    DISPLAY
commands =
    pytest tests src/felupe_contact docs -n auto --dist worksteal {posargs}

[testenv:core]
# import felupe-contact with its required dependencies only (felupe, numpy, scipy)
deps = pytest
extras =
commands =
    pytest tests/test_import.py

[testenv:main]
# run the tests with the development version of FElupe (the main branch)
deps =
    {[testenv]deps}
    felupe[all] @ git+https://github.com/adtzlr/felupe.git@main
