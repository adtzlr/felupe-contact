[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# an explicit selection of rules, independent of the default rules of ruff
select = [
  "E4",  # imports (pycodestyle)
  "E7",  # statements (pycodestyle)
  "E9",  # runtime and syntax errors (pycodestyle)
  "F",  # pyflakes
  "B006",  # mutable default arguments
  "I",  # sorted imports (isort)
  "W",  # whitespace
]
ignore = [
  "E731",  # lambda assignments, e.g. for short functions in tests and examples
  "E741",  # ambiguous variable names, e.g. `l` (notation of continuum mechanics)
]

[tool.ruff.lint.per-file-ignores]
# the public API is re-exported
"__init__.py" = ["F401"]
# results of calls are bound to variables without being checked
"tests/**" = ["F841"]
# the scripts of sphinx-gallery import modules in later cells
"examples/**" = ["E402"]

[tool.pytest.ini_options]
# the code-examples of the documentation are tested by the doctests of the rst-files
testpaths = ["tests", "src/felupe_contact", "docs"]
addopts = ["--doctest-modules", "--doctest-glob=*.rst", "--import-mode=importlib"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[project]
name = "felupe-contact"
description = "Contact Extension-package for FElupe."
readme = "README.md"
authors = [
  {name = "Andreas Dutzler", email = "a.dutzler@gmail.com"},
]
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
  "computational-mechanics",
  "contact-mechanics",
  "fea",
  "fem",
  "finite-elements",
  "finite-elements-methods",
  "partial-differential-equations",
  "python",
  "scientific-computing",
  "solid-mechanics-codes",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Utilities"
]
dynamic = ["version"]

dependencies = [
  "felupe",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-autoapi",
    "sphinx-codeautolink",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-gallery",
    "sphinx-inline-tabs",
    "pypandoc",
]
all = ["felupe[all]"]

[dependency-groups]
read-the-docs = ["felupe-contact[all,docs]"]

[tool.setuptools.dynamic]
version = {attr = "felupe_contact.__about__.__version__"}

[project.urls]
Homepage = "https://felupe-contact.readthedocs.io/en/latest"
Documentation = "https://felupe-contact.readthedocs.io/en/latest"
Repository = "https://github.com/adtzlr/felupe-contact"
Issues = "https://github.com/adtzlr/felupe-contact/issues"
Changelog = "https://github.com/adtzlr/felupe-contact/blob/main/CHANGELOG.md"
